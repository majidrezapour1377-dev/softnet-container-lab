name: routing-lab

topology:
  nodes:
    hs1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.0.1.2/24 dev eth1
        - ip -6 addr add 2001:1::2/64 dev eth1
        - ip route replace default via 10.0.1.1
        - ip -6 route replace default via 2001:1::1

    rt1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.0.1.1/24 dev eth1
        - ip addr add 10.0.2.1/24 dev eth2
        - ip -6 addr add 2001:1::1/64 dev eth1
        - ip -6 addr add 2001:2::1/64 dev eth2
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv6.conf.all.forwarding=1

    hs2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.0.2.2/24 dev eth1
        - ip -6 addr add 2001:2::2/64 dev eth1
        - ip route replace default via 10.0.2.1
        - ip -6 route replace default via 2001:2::1

  links:
    - endpoints: ["hs1:eth1", "rt1:eth1"]
    - endpoints: ["rt1:eth2", "hs2:eth1"]
